# Content sources for the weekly content-watch job (SDD §8.2).
#
# HOW TO ADD A SOURCE
#   1. Copy an existing entry of the same kind (a blog feed, a sitemap, or a "what's on" page)
#      and paste it at the end of the list.
#   2. Give it a new unique `id` (lowercase letters, digits and dashes) and a `name`.
#   3. Set `urls` to the feed / sitemap / listing page and `domains` to the site's hostname(s).
#   4. Optional filters: `include` / `exclude` are regular expressions (case-insensitive) tested
#      against each found URL;
#      `keywords` must appear in the item title, summary or URL (case-insensitive).
#   5. Leave a line in `notes` saying what you checked and when.
#   The pipeline validates this file on every run; a typo stops the run with a clear message.
#
# FIELDS
#   tier       1 = official or organiser site (can be published); 2 = aggregator (discovery only:
#              the pipeline follows the article's link to the official page and uses that instead).
#   kind       activity | outing
#   detection  feed     = RSS or Atom; new entries are new items
#              sitemap  = sitemap.xml (or sitemap index); new URLs (or changed lastmod) are new items
#              listing  = an HTML "what's on" page; new links on it are new items
#   child_sitemaps   for a sitemap index: regexes picking which child sitemaps to read
#   track_lastmod    sitemap only; false when a site re-stamps every lastmod in bulk
#   philosophy       default tags for activity sources: montessori | lovevery | reggio_emilia
#   max_items_per_run  items sent to Gemini per run (default 15)
#   frequency  weekly (default) or monthly (read only on the monthly run)
#   enabled    false = skipped (say why in notes)
#
# Verification: every URL below was requested on 2026-10-18/19 with a desktop Chrome user agent,
# robots.txt honoured and at least 2 s between requests to the same host.

version: 1

# Official sites (government, venues, organisers) that tier-2 articles may link to. An item
# discovered on an aggregator is only used if it resolves to one of these or to a tier-1 source.
official_domains:
  - gov.sg               # any Singapore government site (nlb.gov.sg, nparks.gov.sg, onepa.gov.sg, pa.gov.sg, ...)
  - go.gov.sg            # official short links; they redirect to gov.sg pages
  - nlb.gov.sg
  - nlb.libcal.com
  - nparks.gov.sg
  - onepa.gov.sg
  - nhb.gov.sg
  - roots.gov.sg
  - heritage.sg
  - childrensmuseum.sg
  - esplanade.com
  - mandai.com
  - nationalgallery.sg
  - sentosa.com.sg
  - rwsentosa.com
  - gardensbythebay.com.sg
  - science.edu.sg
  - jewelchangiairport.com
  - changiairport.com
  - marinabaysands.com
  - visitsingapore.com
  - riverhongbao.sg
  - chinatownfestivals.sg
  - orchardroad.org
  - christmaswonderland.sg
  - chingay.gov.sg
  - nightfestival.gov.sg
  - sso.org.sg
  - srt.com.sg
  - artshouselimited.sg
  - activesgcircle.gov.sg

