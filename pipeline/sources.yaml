  - id: nlb-libcal
    name: NLB events (LibCal)
    tier: 1
    kind: outing
    detection: feed
    urls:
      - https://nlb.libcal.com/rss.php?cid=11498&m=month
    domains: [nlb.libcal.com, nlb.gov.sg]
    # Matched against title, description and the LibCal audience tags ("Babies (<1 yo)", "Toddlers (1-3 yo)").
    keywords: [baby, babies, toddler, toddlers, storytime, story time, Early READ]
    max_items_per_run: 15
    notes: >-
      2026-10-19: RSS 200, 3.1 MB, 300 items (the feed's cap). Audience tags: 10 Babies, 16 Toddlers.
      45 items match the keywords; most "Storytime at X Library" sessions are tagged 4-12 yo, so the
      age gate drops them later.

  - id: onepa
    name: OnePA (People's Association)
    tier: 1
    kind: outing
    detection: sitemap
    urls:
      - https://www.onepa.gov.sg/sitemap.xml
    domains: [onepa.gov.sg]
    child_sitemaps: ['/sitemap-event\.xml', '/sitemap-course\.xml']
    include: ['onepa\.gov\.sg/(events|courses)/']
    # Course and event URLs carry the title as a slug, so keywords filter on the slug.
    keywords: [baby, babies, toddler, infant, newborn, parent-child, parent-and-child, playgroup, tots]
    track_lastmod: false
    max_items_per_run: 10
    notes: >-
      2026-10-19: sitemap index 200 with 6 children (child URLs carry a ?rev= hash that changes).
      sitemap-course.xml 3,902 URLs, sitemap-event.xml 2,152 URLs; 162 match the keywords. Every
      lastmod is re-stamped daily, so only new URLs count. Detail pages are server-rendered.

